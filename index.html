<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="My newest software">
<title>KiwiReload</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    font-family: "Inter", Arial, sans-serif;
    color: #fff;

    background-image: url("https://files.catbox.moe/zvv06p.png");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background: #000;
    opacity: 0.35;

    z-index: 0;
    pointer-events: none;
}

main {
    position: relative;
    z-index: 1;

    text-align: center;
    padding: 30px;

    perspective: 1000px;
}

@keyframes rotateIn {
    0% {
        opacity: 0;
        transform: rotateY(-90deg) scale(0.9);
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: rotateY(0deg) scale(1);
    }
}

h1 {
    margin: 0 0 8px;

    font-size: clamp(32px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;

    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);

    animation: rotateIn 2s cubic-bezier(0.22, 1, 0.36, 1) both;
}

p {
    margin: 0;

    color: #e4e4e4;
    font-size: 15px;
    font-weight: 600;

    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);

    animation: rotateIn 2s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
}

.download {
    display: inline-block;

    margin-top: 20px;
    padding: 10px 20px;

    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 7px;

    background: rgba(0, 0, 0, 0.45);
    color: #fff;

    font-family: inherit;
    font-size: 14px;
    font-weight: 700;

    text-decoration: none;

    animation: rotateIn 2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
}

.download:hover {
    background: rgba(0, 0, 0, 0.7);
    border-color: #fff;
    transform: translateY(-2px);
}

.github {
    position: fixed;
    right: 18px;
    bottom: 18px;

    z-index: 2;

    width: 30px;
    height: 30px;

    color: #fff;
    opacity: 0.75;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.github:hover {
    opacity: 1;
    transform: scale(1.1);
}

.github svg {
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>

<main>
    <h1>Kiwi Reloader 7.2.0</h1>

    <p>Stream UVB-76 without a problem</p>

    <a class="download" href="https://github.com/noaa-apt/kiwi-reload/releases/tag/7.2.0">
        Download
    </a>
</main>

<a
    class="github"
    href="https://github.com/noaa-apt/kiwi-reload"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="GitHub"
>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
            fill="currentColor"
            d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.26c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.66 1.65.25 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5"
        />
    </svg>
</a>

</body>
</html>
